name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Release APK
      run: ./gradlew assembleRelease
    - name: Sign APK
      run: |
        keytool -genkey -v -keystore key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -dname "CN=test" -storepass password
        SIGNER=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)/apksigner
        find app_pojavlauncher/build/outputs/apk/ -name "*.apk" -exec $SIGNER sign --ks key.jks --ks-pass pass:password {} \;
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app_pojavlauncher/build/outputs/apk/**/*.apk
