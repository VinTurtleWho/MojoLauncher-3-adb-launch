name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Brute-Force Download Missing Submodules
      run: |
        git submodule update --init --recursive --force || true
        if [ ! -f "glfw/android-gradle/build.gradle" ]; then
          echo "GLFW is completely empty! Force downloading it manually..."
          rm -rf glfw
          git clone https://github.com/PojavLauncherTeam/glfw.git glfw
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app_pojavlauncher/build/outputs/apk/debug/
